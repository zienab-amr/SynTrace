name: CI

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore backend/SynTrace.api/SynTrace.api.slnx -p:NuGetAuditMode=all

      - name: Build project
        run: dotnet build --no-restore backend/SynTrace.api/SynTrace.api.slnx

      - name: Run backend integration checks
        run: dotnet run --project backend/SynTrace.api/SynTrace.IntegrationChecks --no-build --no-restore

      - name: Check EF migrations
        working-directory: backend/SynTrace.api
        run: |
          dotnet tool install dotnet-ef --tool-path "${{ runner.temp }}/ef-tools" --version 10.0.13
          "${{ runner.temp }}/ef-tools/dotnet-ef" migrations has-pending-model-changes --project SynTrace.infrastructure --startup-project SynTrace_api --no-build
