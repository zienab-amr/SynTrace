# WebSocket connection handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Avoid logging sensitive query parameters
log_format syntrace_safe
    '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" '
    '$status $body_bytes_sent '
    'request_time=$request_time '
    'upstream_time=$upstream_response_time';

server {
    listen 80;
    server_name _;

    server_tokens off;

    access_log /var/log/nginx/access.log syntrace_safe;

    # Use relative redirects
    absolute_redirect off;

    # Request limits and timeouts
    client_max_body_size 30m;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Common upstream headers
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";

    # Docker internal DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream http://backend-proxy:8080;
    set $flutter_upstream http://flutter-web:80;
    set $react_upstream http://react-web:80;

    # Gateway health check
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "Gateway Healthy\n";
    }

    # Backend API
    location /api/ {
        proxy_pass $backend_upstream;
    }

    # SignalR WebSockets
    location /hubs/ {
        proxy_pass $backend_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Scalar API documentation
    location = /scalar {
        proxy_pass $backend_upstream;
    }

    location /scalar/ {
        proxy_pass $backend_upstream;
    }

    # OpenAPI specification
    location /openapi/ {
        proxy_pass $backend_upstream;
    }

    # Backend health endpoints
    location /health/ {
        proxy_pass $backend_upstream;
    }

    # React Web
    location = /web {
        return 308 /web/;
    }

    location /web/ {
        rewrite ^/web/(.*)$ /$1 break;
        proxy_pass $react_upstream;
    }

    # Flutter Web
    location / {
        proxy_pass $flutter_upstream;
    }
}