services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: syntrace-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\"; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\"; else exit 1; fi"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  
  backend:
    build:
      context: ./backend/SynTrace.api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ConnectionStrings__ConnectionDB: "Server=sqlserver,1433;Database=SynTraceDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__VirtualHost: "/"
      RabbitMQ__UserName: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RabbitMQ__ClientProvidedName: "SynTrace.Api"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  ai-service:
    build:
      context: ./ai-service

  security:
    build:
      context: ./security

  rabbitmq:
    image: rabbitmq:4.4.0-management
    container_name: syntrace-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  rabbitmq_data: