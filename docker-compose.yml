services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: syntrace-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"

  backend:
    build:
      context: ./backend

  ai-service:
    build:
      context: ./ai-service

  security:
    build:
      context: ./security