# Backend only:   docker compose up -d --build
# Whole system:   docker compose --profile ai up -d --build
# Values come from .env next to this file. See .env.example.

x-rabbit-env: &rabbit-env
  RabbitMQ__HostName: "rabbitmq"
  RabbitMQ__Port: "5672"
  RabbitMQ__VirtualHost: "/"
  RabbitMQ__UserName: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}

x-db: &db "Server=sqlserver,1433;Database=SynTraceDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False"

x-ai: &ai
  build:
    context: ./ai-service
  image: syntrace-ai
  profiles: [ai]

x-ai-env: &ai-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
  OLLAMA_URL: http://ollama:11434
  EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
  EMBED_ON_WEBHOOK: "1"
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
  GROQ_FALLBACK_API_KEY: ${GROQ_FALLBACK_API_KEY:-}
  GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-}
  # Meeting transcripts: ERNIE on OpenRouter reads a whole meeting in one call;
  # without its key, or when it is busy, the meeting is read on Groq in parts.
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_FALLBACK_API_KEY: ${OPENROUTER_FALLBACK_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-baidu/ernie-5.5-flash-preview:free}
  MEETING_READS: ${MEETING_READS:-2}
  MEETING_EXTRACT_PROVIDER: ${MEETING_EXTRACT_PROVIDER:-openrouter}
  SEMANTIC_K: ${SEMANTIC_K:-5}
  SEMANTIC_MIN_SCORE: ${SEMANTIC_MIN_SCORE:-0.5}
  AI_API_KEY: ${AI_API_KEY:-}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  TENANT_ID: ${TENANT_ID:-}
  ALLOWED_PROJECTS: ${ALLOWED_PROJECTS:-}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: syntrace-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\"; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\"; else exit 1; fi"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend/SynTrace.api
      dockerfile: Dockerfile
      target: migrate
    environment:
      ConnectionStrings__ConnectionDB: *db
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend/SynTrace.api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      <<: *rabbit-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConnectionDB: *db
      jwt__key: ${JWT_KEY:?Set JWT_KEY in .env}
      JiraOAuth__ClientSecret: ${JIRA_OAUTH_CLIENT_SECRET:-}
      RabbitMQ__ClientProvidedName: "SynTrace.Api"
      AiService__BaseUrl: ${AI_SERVICE_URL:-http://ai-service:8000}
      AiService__ApiKey: ${AI_API_KEY:-}
      AiService__TimeoutSeconds: "90"
      AiService__EnableSynTraceProjectScope: "true"
      GithubOAuth__AppId: ${SYNTRACE_GITHUB_APP_ID:-0}
      GithubOAuth__AppSlug: ${SYNTRACE_GITHUB_APP_SLUG:-}
      GithubOAuth__ClientId: ${SYNTRACE_GITHUB_CLIENT_ID:-}
      GithubOAuth__ClientSecret: ${SYNTRACE_GITHUB_CLIENT_SECRET:-}
      GithubOAuth__WebhookSecret: ${SYNTRACE_GITHUB_WEBHOOK_SECRET:-}
      GithubOAuth__RedirectUri: ${SYNTRACE_GITHUB_REDIRECT_URI:-}
      GithubOAuth__FrontendRedirectUri: ${SYNTRACE_GITHUB_FRONTEND_REDIRECT_URI:-}
      GithubOAuth__PrivateKeyPath: /run/secrets/github-app.pem
      GitHubSync__Enabled: ${SYNTRACE_GITHUB_SYNC_ENABLED:-false}
      GmailSMTP__Host: smtp.gmail.com
      GmailSMTP__Port: "587"
      GmailSMTP__Email: ${SYNTRACE_SMTP_EMAIL:?Set SMTP email}
      GmailSMTP__AppPassword: ${SYNTRACE_SMTP_APP_PASSWORD:?Set SMTP app password}
      GmailSMTP__FromName: SynTrace
      ReverseProxy__KnownProxy: "172.28.250.2"
    volumes:
      # Jira tokens are encrypted with these keys. Without this volume, a new container cannot read them.
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
      - "${SYNTRACE_GITHUB_PRIVATE_KEY_FILE}:/run/secrets/github-app.pem:ro"
    networks:
      default:
      proxy:
        ipv4_address: 172.28.250.3
        aliases:
          - backend-proxy
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend/SynTrace.api
      dockerfile: SynTrace.Worker/Dockerfile
    environment:
      <<: *rabbit-env
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__ConnectionDB: *db
      RabbitMQ__ClientProvidedName: "SynTrace.Worker"
      GithubOAuth__AppId: ${SYNTRACE_GITHUB_APP_ID:-0}
      GithubOAuth__AppSlug: ${SYNTRACE_GITHUB_APP_SLUG:-}
      GithubOAuth__ClientId: ${SYNTRACE_GITHUB_CLIENT_ID:-}
      GithubOAuth__ClientSecret: ${SYNTRACE_GITHUB_CLIENT_SECRET:-}
      GithubOAuth__WebhookSecret: ${SYNTRACE_GITHUB_WEBHOOK_SECRET:-}
      GithubOAuth__RedirectUri: ${SYNTRACE_GITHUB_REDIRECT_URI:-}
      GithubOAuth__FrontendRedirectUri: ${SYNTRACE_GITHUB_FRONTEND_REDIRECT_URI:-}
      GithubOAuth__PrivateKeyPath: /run/secrets/github-app.pem
      GitHubSync__Enabled: ${SYNTRACE_GITHUB_SYNC_ENABLED:-false}
    volumes:
      - "${SYNTRACE_GITHUB_PRIVATE_KEY_FILE}:/run/secrets/github-app.pem:ro"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4.0-management
    container_name: syntrace-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    configs:
      - source: rabbitmq_limits
        target: /etc/rabbitmq/conf.d/90-syntrace.conf
    ports:
      # Set RABBITMQ_BIND_ADDRESS to this machine's Tailscale address when the AI runs on another machine.
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # security:
  #   build:
  #     context: ./security

  # ---------------- AI: only with --profile ai ----------------
  neo4j:
    image: neo4j:5-community
    profiles: [ai]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ai]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${EMBED_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ai-setup:
    <<: *ai
    environment: *ai-env
    command: ["python", "-m", "syntrace_ai.workers.setup_constraints"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  ai-service:
    <<: *ai
    environment: *ai-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ai-setup:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-consumer:
    <<: *ai
    environment:
      <<: *ai-env
      GITHUB_CONSUMER: "1"
    command: ["python", "-m", "syntrace_ai.workers.ai_consumer"]
    depends_on:
      ai-setup:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai-knowledge-worker:
    <<: *ai
    environment:
      <<: *ai-env
      KNOWLEDGE_API_URL: http://backend:8080
    command: ["python", "-m", "syntrace_ai.workers.knowledge_worker"]
    depends_on:
      ai-setup:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

# ---------------- Web Frontends ----------------
  react-web:
    profiles: [web]
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${SYNTRACE_REACT_API_URL:-}
        VITE_BASE_PATH: ${SYNTRACE_REACT_BASE_PATH:-/web/}
    image: syntrace-react
    expose:
      - "80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  flutter-web:
    profiles: [web]
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${SYNTRACE_FLUTTER_API_URL:-/api}
    image: syntrace-flutter-web
    expose:
      - "80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  gateway:
    profiles: [web]
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
      proxy:
        ipv4_address: 172.28.250.2
    depends_on:
      backend:
        condition: service_started
      react-web:
        condition: service_healthy
      flutter-web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/gateway-health
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

configs:
  rabbitmq_limits:
    # Jira webhooks reach 25 MB; the event envelope adds a little.
    content: |
      max_message_size = 30000000

volumes:
  sqlserver_data:
  rabbitmq_data:
  dataprotection_keys:
  neo4j_data:
  ollama_models:

networks:
  default: {}

  proxy:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.250.0/28